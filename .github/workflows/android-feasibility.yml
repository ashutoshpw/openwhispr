name: Android feasibility spike

on:
  pull_request:
    paths:
      - "apps/mobile-feasibility/android/**"
      - ".github/workflows/android-feasibility.yml"
  push:
    branches:
      - main
      - mobile-02-android-feasibility
    paths:
      - "apps/mobile-feasibility/android/**"
      - ".github/workflows/android-feasibility.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Run unit tests, lint, and debug build
        working-directory: apps/mobile-feasibility/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
